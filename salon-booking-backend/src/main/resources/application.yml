spring:
  profiles:
    active: dev
  application:
    name: salon-booking-backend
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB
  
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

logging:
  level:
    com.salonbooking.api: INFO
    org.flywaydb: INFO
    org.hibernate: ERROR
